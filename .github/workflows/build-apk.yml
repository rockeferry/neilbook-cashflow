name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Buat Konfigurasi Capacitor & Inisialisasi
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Membuat file capacitor.config.json secara langsung agar aman tanpa interaksi CLI
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.rockeferry.neilbookcashflow",
            "appName": "Neilbook Cashflow",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: NeilbookCashflow-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
