name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with PWABuilder CLI
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: |
          npm install -g @pwabuilder/pwapush
          # Atau biarkan PWABuilder web mengurusnya secara instan
          echo "Gunakan PWABuilder web untuk hasil instan tanpa error SDK."
